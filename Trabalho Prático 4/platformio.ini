; TP4 - Encoder e controle PID (Arduino Mega 2560)
; Compilar: pio run    |   Gravar: pio run -t upload
; Registrar ensaios: python scripts/plot_serial.py COM7

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/Encoder@^1.4.4
    arduino-libraries/Servo@^1.2.2
